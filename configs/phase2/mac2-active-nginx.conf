worker_processes 1;
pid nginx.pid;
error_log logs/error.log info;
events { worker_connections 256; }
http {
  log_format lab '$time_iso8601 client=$remote_addr status=$status upstream=$upstream_addr upstream_status=$upstream_status';
  access_log logs/access.log lab;
  upstream backend_pool {
    server 10.7.22.88:3001 max_fails=1 fail_timeout=5s;
    server 10.7.12.137:3002 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 10.7.6.136:8443 ssl;
    server_name app.team1.test api.team1.test;
    ssl_certificate certs/leaf.pem;
    ssl_certificate_key certs/leaf-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Edge edge always;
    location / {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
